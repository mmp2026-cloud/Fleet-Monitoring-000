function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];

}
function statusLabel(s) {

}
function statusCountBadges(counts) {

    '<span class="badge DUE_SOON">Due Soon ' + counts.DUE_SOON + '</span> ' +

}
function fmtDate(ts) {
  if (!ts) return '—';
  var d = ts.toDate ? ts.toDate() : new Date(ts);
  return isNaN(d) ? '—' : d.toLocaleString();
}
function readingUnit(v) { return v.readingUnit === 'hours' ? 'hours' : 'km'; }
function readingUnitLabel(v) { return readingUnit(v) === 'hours' ? 'hours (SMR)' : 'km (odometer)'; }
function readingUnitName(v) { return readingUnit(v) === 'hours' ? 'SMR' : 'odometer'; }
function readingUnitSuffix(v) { return readingUnit(v) === 'hours' ? 'hours' : 'km'; }
function readingUnitPrompt(v) { return readingUnit(v) === 'hours' ? 'SMR reading (hours)' : 'odometer reading (km)'; }
function computeStatus(v) {
  var services = [];
  if (hasPMS(v)) services.push(computeServiceStatus(v, 'pms'));
  if (hasGeneralService(v)) services.push(computeServiceStatus(v, 'general'));
  var severity = { OK: 0, DUE_SOON: 1, OVERDUE: 2 };
  return services.reduce(function (worst, status) {
    return severity[status.status] > severity[worst.status] ? status : worst;
  }, services[0] || { readingSinceLastService: 0, remaining: 0, status: 'OK', specialNotice: v.specialNotice || '' });
}
function computeServiceStatus(v, service) {
  var interval = service === 'general'
    ? generalServiceInterval(v)
    : pmsInterval(v);
  var lastReading = service === 'general'
    ? (v.lastGeneralServiceOdometer == null ? Number(v.lastPMSOdometer) || 0 : Number(v.lastGeneralServiceOdometer))
    : Number(v.lastPMSOdometer) || 0;
  var since = Number(v.currentOdometer) - lastReading;
  var remaining = interval - since;
  var status = 'OK';
  if (interval > 0) {
    if (remaining <= 0) status = 'OVERDUE';
    else if (remaining <= interval * DUE_SOON_RATIO) status = 'DUE_SOON';
  }
  return { readingSinceLastService: since, remaining: remaining, status: status, specialNotice: v.specialNotice || '' };
}
function generalServiceInterval(v) {
  if (v.servicePlan === 'pms_only') return 0;
  if (v.generalServiceIntervalKm != null) return Number(v.generalServiceIntervalKm) || 0;
  if (v.servicePlan === 'general_only') return 0;
  return (Number(v.pmsIntervalKm) || 0) / 2;
}
function pmsInterval(v) {
  if (v.servicePlan === 'general_only') return 0;
  return Number(v.pmsIntervalKm) || generalServiceInterval(v) * 2;
}
function hasPMS(v) { return v.servicePlan !== 'general_only'; }
function hasGeneralService(v) { return v.servicePlan !== 'pms_only'; }
function equipmentId(v) { return v.equipmentId || v.plate || v.id; }
function equipmentLabel(v) { return equipmentId(v) + (v.equipmentType ? ' — ' + v.equipmentType : (v.name ? ' — ' + v.name : '')); }
function dateValue(value) {
  if (!value) return '';
  var d = value.toDate ? value.toDate() : new Date(value);
  return isNaN(d) ? '' : d.toISOString().slice(0, 10);
}
function dateInputValue(value) {
  if (!value) return '';
  var d = value.toDate ? value.toDate() : new Date(value);
  if (isNaN(d)) return '';
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function dateKey(value) { return dateValue(value); }
function integrationUrl() { return localStorage.getItem('fleetSheetWebhook') || ''; }
function scheduleDate(v, service) {
  if (service === 'general') {
    if (!hasGeneralService(v)) return '';
    return v.generalServiceScheduleMode === 'manual'
      ? v.nextGeneralServiceDate
      : (v.forecastGeneralServiceDate || '');
  }
  if (!hasPMS(v)) return '';
  return (v.pmsScheduleMode || v.scheduleMode) === 'manual'
    ? v.nextPMSDate
    : (v.forecastPMSDate || '');
}
function localDateKey(date) {
  return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
}
function csvCell(value) {
  var text = String(value == null ? '' : value);
  if (/^[\s]*[=+\-@\t\r]/.test(text)) text = "'" + text;
  return '"' + text.replace(/"/g, '""') + '"';
}
function downloadCsv(rows, filename) {
  var csv = '\uFEFF' + rows.map(function (row) { return row.map(csvCell).join(','); }).join('\r\n');
  var url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  var link = document.createElement('a');
  link.href = url; link.download = filename; link.click();
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}
function importHeaderKey(value) {
  return String(value == null ? '' : value).toLowerCase().replace(/[^a-z0-9]/g, '');
}
function importCell(row, headerIndexes, aliases) {
  for (var i = 0; i < aliases.length; i++) {
    var index = headerIndexes[importHeaderKey(aliases[i])];
    if (index != null && row[index] != null) return row[index];
  }
  return '';
}
function importDateValue(value) {
  if (value == null || value === '') return '';
  if (value instanceof Date && !isNaN(value.getTime())) return localDateKey(value);
  if (typeof value === 'number' && window.XLSX && XLSX.SSF) {
    var parts = XLSX.SSF.parse_date_code(value);
    if (parts) return String(parts.y).padStart(4, '0') + '-' + String(parts.m).padStart(2, '0') + '-' + String(parts.d).padStart(2, '0');
  }
  var text = String(value).trim();
  var iso = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (iso) {
    var date = new Date(Number(iso[1]), Number(iso[2]) - 1, Number(iso[3]));
    if (date.getFullYear() !== Number(iso[1]) || date.getMonth() !== Number(iso[2]) - 1 || date.getDate() !== Number(iso[3])) return null;
    return localDateKey(date);
  }
  var parsed = new Date(text);
  return isNaN(parsed.getTime()) ? null : localDateKey(parsed);
}
function buildImportedVehicle(row, headerIndexes, rowNumber) {
  var id = String(importCell(row, headerIndexes, ['Equipment ID', 'EquipmentID', 'Unit ID', 'Vehicle ID'])).trim();
  var type = String(importCell(row, headerIndexes, ['Equipment Type', 'EquipmentType', 'Type'])).trim();
  var planText = importHeaderKey(importCell(row, headerIndexes, ['Service Schedule', 'Service Plan']));
  var servicePlan = planText === 'pmsonly' || planText === 'pms' ? 'pms_only'
    : planText === 'pmsgeneral' || planText === 'pmsgeneralservicing' || planText === 'pmsandgeneralservicing' ? 'pms_general' : '';
  var unitText = importHeaderKey(importCell(row, headerIndexes, ['Reading Unit', 'Unit']));
  var unit = unitText === 'hours' || unitText === 'hour' || unitText === 'smr' ? 'hours' : 'km';
  var intervalValue = importCell(row, headerIndexes, servicePlan === 'pms_only'
    ? ['PMS Interval', 'Service Interval', 'Interval']
    : ['General Servicing Interval', 'General Service Interval', 'Service Interval', 'Interval']);
  var interval = Number(intervalValue);
  var lastPmsValue = importCell(row, headerIndexes, ['Previous PMS Reading', 'Previous PMS Odometer', 'Last PMS Reading', 'Last PMS Odometer']);
  var lastPms = Number(lastPmsValue);
  var currentValue = importCell(row, headerIndexes, ['Current Reading', 'Current Odometer', 'Current SMR']);
  var current = currentValue === '' || currentValue == null ? null : Number(currentValue);
  var lastGeneralValue = importCell(row, headerIndexes, ['Previous General Servicing Reading', 'Previous General Service Reading', 'Last General Servicing Reading']);
  var lastGeneral = lastGeneralValue === '' || lastGeneralValue == null ? lastPms : Number(lastGeneralValue);
  var lastPmsDate = importDateValue(importCell(row, headerIndexes, ['Previous PMS Date', 'Last PMS Date']));
  var lastGeneralDate = importDateValue(importCell(row, headerIndexes, ['Previous General Servicing Date', 'Previous General Service Date', 'Last General Servicing Date']));
  var nextPmsDate = importDateValue(importCell(row, headerIndexes, ['Next PMS Date']));
  var nextGeneralDate = importDateValue(importCell(row, headerIndexes, ['Next General Servicing Date', 'Next General Service Date']));
  var problems = [];
  if (!id) problems.push('Equipment ID is required');
  if (!type) problems.push('Equipment Type is required');
  if (!servicePlan) problems.push('Service Schedule must be PMS only or PMS + General Servicing');
  if (unitText && ['km', 'kms', 'kilometer', 'kilometers', 'odometer', 'hours', 'hour', 'smr'].indexOf(unitText) === -1) {
    problems.push('Reading Unit must be km or hours (SMR)');
  }
  if (!Number.isFinite(interval) || interval <= 0) problems.push('Valid service interval is required');
  if (!Number.isFinite(lastPms) || lastPms < 0) problems.push('Previous PMS reading is required');
  if (current !== null && (!Number.isFinite(current) || current < 0)) problems.push('Current Reading must be a non-negative number');
  if (servicePlan === 'pms_general' && lastGeneralValue !== '' && (!Number.isFinite(lastGeneral) || lastGeneral < 0)) {
    problems.push('Previous General Servicing Reading must be a non-negative number');
  }
  if ([lastPmsDate, lastGeneralDate, nextPmsDate, nextGeneralDate].some(function (date) { return date === null; })) {
    problems.push('A service date is invalid; use YYYY-MM-DD');
  }
  if (servicePlan === 'pms_only') {
    lastGeneral = null;
    lastGeneralDate = '';
    nextGeneralDate = '';
  } else if (lastGeneralDate === '') {
    lastGeneralDate = lastPmsDate || '';
  }
  var hasGeneral = servicePlan === 'pms_general';
  var currentReading = current === null
    ? Math.max(lastPms, hasGeneral && lastGeneral != null ? lastGeneral : 0)
    : current;
  return {
    rowNumber: rowNumber,
    problems: problems,
    equipmentId: id,
    equipmentType: type,
    servicePlan: servicePlan,
    readingUnit: unit,
    generalServiceIntervalKm: hasGeneral ? interval : null,
    pmsIntervalKm: hasGeneral ? interval * 2 : interval,
    lastPMSOdometer: lastPms,
    lastPMSDate: lastPmsDate ? new Date(lastPmsDate + 'T12:00:00') : null,
    lastGeneralServiceOdometer: lastGeneral,
    lastGeneralServiceDate: lastGeneralDate ? new Date(lastGeneralDate + 'T12:00:00') : null,
    nextPMSDate: nextPmsDate || '',
    pmsScheduleMode: nextPmsDate ? 'manual' : 'auto',
    nextGeneralServiceDate: nextGeneralDate || '',

    currentOdometer: currentReading,
    lastSubmissionAt: null,

}
function downloadEquipmentTemplate() {
  downloadCsv([
    ['Equipment ID', 'Equipment Type', 'Reading Unit', 'Service Schedule', 'PMS Interval', 'General Servicing Interval', 'Previous PMS Date', 'Previous PMS Reading', 'Previous General Servicing Date', 'Previous General Servicing Reading', 'Current Reading', 'Next PMS Date', 'Next General Servicing Date'],
    ['EQ-001', 'Generator', 'hours', 'PMS only', '500', '', '2026-01-15', '1200', '', '', '1350', '', '']
  ], 'fleet-equipment-import-template.csv');
}
function exportEquipmentList(vehicles) {
  var rows = [['Equipment ID', 'Equipment Type', 'Reading Unit', 'Service Schedule', 'PMS Interval', 'General Servicing Interval', 'Previous PMS Date', 'Previous PMS Reading', 'Previous General Servicing Date', 'Previous General Servicing Reading', 'Current Reading', 'Next PMS Date', 'Next General Servicing Date']];
  vehicles.forEach(function (v) {
    rows.push([
      equipmentId(v), v.equipmentType || v.name || '', readingUnit(v),
      hasGeneralService(v) ? 'PMS + General Servicing' : 'PMS only',
      hasPMS(v) ? pmsInterval(v) : '', hasGeneralService(v) ? generalServiceInterval(v) : '',
      dateValue(v.lastPMSDate), v.lastPMSOdometer == null ? '' : v.lastPMSOdometer,
      dateValue(v.lastGeneralServiceDate), v.lastGeneralServiceOdometer == null ? '' : v.lastGeneralServiceOdometer,
      v.currentOdometer, dateValue(scheduleDate(v, 'pms')), dateValue(scheduleDate(v, 'general'))
    ]);
  });
  downloadCsv(rows, 'fleet-equipment-list-' + localDateKey(new Date()) + '.csv');
}
async function importEquipmentFile(file, existingVehicles) {
  if (!window.XLSX) throw new Error('Excel/CSV import library did not load. Refresh the page and try again.');
  if (!/\.(csv|xlsx|xls)$/i.test(file.name)) throw new Error('Choose a CSV, XLSX, or XLS file.');
  var workbook;
  if (/\.csv$/i.test(file.name)) {
    workbook = XLSX.read(await file.text(), { type: 'string', cellDates: true });
  } else {
    workbook = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
  }
  if (!workbook.SheetNames.length) throw new Error('The selected file has no worksheets.');
  var sheet = workbook.Sheets[workbook.SheetNames[0]];
  var data = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', raw: true, blankrows: true });
  if (data.length < 2) throw new Error('The file must contain a header row and at least one equipment row.');
  var headerIndexes = {};
  data[0].forEach(function (header, index) {
    var key = importHeaderKey(header);
    if (key) headerIndexes[key] = index;
  });
  var rows = [];
  data.slice(1).forEach(function (row, index) {
    if (!row.some(function (value) { return String(value == null ? '' : value).trim() !== ''; })) return;
    rows.push(buildImportedVehicle(row, headerIndexes, index + 2));
  });
  if (!rows.length) throw new Error('No equipment rows were found in the selected file.');
  if (rows.length > 450) throw new Error('Import is limited to 450 equipment per file so it can be saved atomically. Split the file into smaller parts.');
  var seen = {};
  existingVehicles.forEach(function (v) { seen[String(equipmentId(v)).trim().toLowerCase()] = 'already registered'; });
  rows.forEach(function (row) {
    var key = row.equipmentId.toLowerCase();
    if (key && seen[key]) row.problems.push('Equipment ID ' + seen[key] + ' (duplicate)');
    else if (key) seen[key] = 'repeated in this file';
  });
  return rows;
}
async function saveImportedEquipment(rows) {
  var batch = writeBatch(db);
  rows.forEach(function (row) {
    var ref = doc(collection(db, 'vehicles'));
    var record = Object.assign({}, row);
    delete record.rowNumber;
    delete record.problems;
    batch.set(ref, record);
  });
  await batch.commit();
}

async function listVehicles() {
  var snap = await getDocs(collection(db, 'vehicles'));
  return snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
}
async function getVehicle(id) {
  var snap = await getDoc(doc(db, 'vehicles', id));
  return snap.exists() ? Object.assign({ id: snap.id }, snap.data()) : null;
}
async function listReadingLogs(vehicleId) {
  var snap = await getDocs(query(collection(db, 'vehicles', vehicleId, 'logs'), orderBy('timestamp', 'asc')));
  return snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
}
function estimateDailyUsage(logs) {
  var readings = (logs || []).filter(function (log) {
    return log.recalled !== true && log.timestamp && Number.isFinite(Number(log.odometer)) && Number(log.odometer) >= 0;
  }).map(function (log) {
    return {
      timestamp: log.timestamp.toDate ? log.timestamp.toDate() : new Date(log.timestamp),
      odometer: Number(log.odometer)

  }).filter(function (reading) { return !isNaN(reading.timestamp.getTime()); });

  var recentCutoff = new Date();
  recentCutoff.setDate(recentCutoff.getDate() - 7);
  var recentReadings = readings.filter(function (reading) { return reading.timestamp >= recentCutoff; });
  var groupByDay = function (sourceReadings) {
    var grouped = [];
    sourceReadings.forEach(function (reading) {
      var key = localDateKey(reading.timestamp);
      var last = grouped[grouped.length - 1];
      if (last && last.date === key) last.reading = reading;
      else grouped.push({ date: key, reading: reading });
    });
    return grouped;
  };

var adminLoginMessage = '';
onAuthStateChanged(auth, function (user) {
  if (VEHICLE_ID) {
    if (user && !user.isAnonymous) {
      signOut(auth).catch(function (err) {
        app.innerHTML = '<div class="card"><p class="err">Could not switch to operator access: ' + esc(err.message) + '</p></div>';
      });
      return;
    }
    if (!user) {
      signInAnonymously(auth).catch(function (err) {
        app.innerHTML = '<div class="card"><p class="err">Could not connect: ' + esc(err.message) + '</p></div>';
      });
      return;
    }
    renderDriverLoading();
    getVehicle(VEHICLE_ID).then(function (v) {
      v ? renderDriverForm(v) : renderDriverNotFound();
    }).catch(renderError);
    return;
  }
  if (!user) {
    renderAdminLogin(adminLoginMessage);
    adminLoginMessage = '';
    return;
  }
  if (user.isAnonymous) {
    signOut(auth).catch(renderError);
    return;
  }
  renderAdminLoading();
  getDoc(doc(db, 'admins', user.uid)).then(function (adminDoc) {
    if (!adminDoc.exists() || adminDoc.data().enabled !== true) {
      renderAdminPendingApproval(user);
      return;
    }
    loadAdmin();
  }).catch(renderError);
});

function renderAdminLogin(message) {
  app.innerHTML = '<div class="card auth-card"><h1>Fleet PMS Admin</h1>' +
    '<p class="sub">Ilagay ang admin access code para buksan ang dashboard.</p>' +
    '<form id="admin-login-form"><label for="admin-code">Admin access code</label><input id="admin-code" type="password" autocomplete="current-password" minlength="6" required>' +
    '<div id="login-error" class="err">' + (message ? esc(message) : '') + '</div>' +
    '<button class="primary" type="submit" style="width:100%">Open dashboard</button></form>' +
    '<p class="muted">Ibahagi lamang ang access code sa mga aprubadong admin.</p></div>';
  document.getElementById('admin-login-form').onsubmit = function (event) {
    event.preventDefault();
    var code = document.getElementById('admin-code').value;
    var button = document.querySelector('#admin-login-form button');
    var error = document.getElementById('login-error');
    button.disabled = true; button.textContent = 'Verifying…'; error.textContent = '';
    signInWithEmailAndPassword(auth, ADMIN_AUTH_EMAIL, code).catch(function (err) {
      if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
        error.textContent = 'Hindi tama ang admin access code.';
      } else if (err.code === 'auth/operation-not-allowed') {
        error.textContent = 'I-enable muna ang Email/Password sa Firebase Authentication.';
      } else {

      }
      button.disabled = false; button.textContent = 'Open dashboard';
    });
  };
}

function statusBanner(v) {
  v = applyCachedForecasts(v);
  var html = '';
  var p = hasPMS(v) ? computeServiceStatus(v, 'pms') : null;
  if (p) html += '<div class="row"><span class="badge ' + p.status + '">PMS ' + statusLabel(p.status) + '</span>' +
    '<span class="muted">' + p.readingSinceLastService.toLocaleString() + ' ' + readingUnitSuffix(v) + ' since last PMS</span></div>';
  var statuses = [];
  if (p) statuses.push({ label: 'PMS', status: p });
  if (hasGeneralService(v)) {
    var gs = computeServiceStatus(v, 'general');
    statuses.push({ label: 'General Servicing', status: gs });
    html += '<div class="row" style="margin-top:6px"><span class="badge ' + gs.status + '">General Servicing ' + statusLabel(gs.status) + '</span>' +
      '<span class="muted">' + gs.readingSinceLastService.toLocaleString() + ' ' + readingUnitSuffix(v) + ' since last General Servicing</span></div>';
  }
  statuses.forEach(function (item) {
    if (item.status.status === 'OVERDUE') html += '<p class="muted">' + item.label + ' overdue by ' + Math.abs(item.status.remaining).toLocaleString() + ' ' + readingUnitSuffix(v) + '.</p>';
    else if (item.status.status === 'DUE_SOON') html += '<p class="muted">' + item.label + ' due in ' + item.status.remaining.toLocaleString() + ' ' + readingUnitSuffix(v) + '.</p>';
  });
  if (v.specialNotice) {
    html += '<p><span class="badge notice">Notice</span> ' + esc(v.specialNotice) + '</p>';
  }
  if (hasPMS(v)) {
    var pmsDate = scheduleDate(v, 'pms');
    html += '<p class="muted" style="margin:8px 0 0">Next PMS: ' +
      (pmsDate ? esc(dateValue(pmsDate)) + ((v.pmsScheduleMode || v.scheduleMode) === 'manual' ? ' (scheduled)' : ' (estimated)') : 'waiting for more operator readings to estimate a date') +
      '</p>';
  }
  if (hasGeneralService(v)) {
    var generalDate = scheduleDate(v, 'general');
    html += '<p class="muted" style="margin:4px 0 0">Next General Servicing: ' +
      (generalDate ? esc(dateValue(generalDate)) + (v.generalServiceScheduleMode === 'manual' ? ' (scheduled)' : ' (estimated)') : 'waiting for more operator readings to estimate a date') +
      '</p>';
  }
  return html;
}

function renderDriverForm(v) {
  v = applyCachedForecasts(v);
  app.innerHTML =
    '<h1>' + esc(equipmentLabel(v)) + '</h1>' +
    '<p class="sub">Current recorded ' + readingUnitName(v) + ': ' + Number(v.currentOdometer).toLocaleString() + ' ' + readingUnitSuffix(v) + '</p>' +
    '<div class="card">' + statusBanner(v) + '</div>' +
    '<div class="card">' +
      '<label>New ' + readingUnitPrompt(v) + '</label>' +

function loadAdmin() {
  listVehicles().then(function (vehicles) {
    return Promise.all(vehicles.map(function (v) {
      return listReadingLogs(v.id).then(function (logs) {
        var savedDailyUsage = v.forecastDailyUsage;
        var savedPMSDate = v.forecastPMSDate || '';
        var savedGeneralDate = v.forecastGeneralServiceDate || '';
        var usage = estimateDailyUsage(logs);
        var dailyUsage = usage ? Math.round(usage.unitsPerDay * 100) / 100 : null;
        v.forecastDailyUsage = dailyUsage;
        v.forecastPMSDate = forecastServiceDateFromUsage(v, 'pms', dailyUsage || 0);
        v.forecastGeneralServiceDate = forecastServiceDateFromUsage(v, 'general', dailyUsage || 0);
        v.dailyUsageEstimate = usage;
        v.readingCount = logs.filter(function (log) { return log.recalled !== true; }).length;
        v.readingLogs = logs;
        var forecastUpdates = {};
        if (dailyUsage !== savedDailyUsage) forecastUpdates.forecastDailyUsage = dailyUsage;
        if (v.forecastPMSDate !== savedPMSDate) forecastUpdates.forecastPMSDate = v.forecastPMSDate;
        if (v.forecastGeneralServiceDate !== savedGeneralDate) forecastUpdates.forecastGeneralServiceDate = v.forecastGeneralServiceDate;
        return Object.keys(forecastUpdates).length
          ? updateDoc(doc(db, 'vehicles', v.id), forecastUpdates).then(function () { return v; })
          : v;
      });
    }));
  }).then(renderAdmin).catch(renderError);
}

  var pmsCounts = { OK: 0, DUE_SOON: 0, OVERDUE: 0 };
  var generalCounts = { OK: 0, DUE_SOON: 0, OVERDUE: 0 };
  vehicles.forEach(function (v) {
    counts[computeStatus(v).status]++;
    if (hasPMS(v)) pmsCounts[computeServiceStatus(v, 'pms').status]++;
    if (hasGeneralService(v)) generalCounts[computeServiceStatus(v, 'general').status]++;
  });

  var html = '<div class="row"><div><h1>Fleet PMS Dashboard</h1><p class="muted">' + esc(auth.currentUser.email || '') + '</p></div><button id="admin-signout">Sign out</button></div>' +
    '<div class="card status-summary" aria-label="Equipment service status">' +
      '<div class="status-summary-row"><span class="status-summary-label">Equipment (' + vehicles.length + ')</span>' + statusCountBadges(counts) + '</div>' +
      '<div class="status-summary-row"><span class="status-summary-label">PMS</span>' + statusCountBadges(pmsCounts) + '</div>' +

async function exportReadingLogs(vehicles, dateFilter) {
  var status = document.getElementById('export-status');
  status.textContent = 'Preparing export…';
  var rows = [['Timestamp', 'Equipment ID', 'Equipment Type', 'Reading Unit', 'Operator', 'Reading', 'Previous Reading', 'Recalled']];
  vehicles.forEach(function (v) {
    (v.readingLogs || []).forEach(function (log) {
      var timestamp = log.timestamp && log.timestamp.toDate ? log.timestamp.toDate() : new Date(log.timestamp);
      if (!log.timestamp || isNaN(timestamp.getTime())) return;
      if (dateFilter && localDateKey(timestamp) !== dateFilter) return;
      rows.push([
        timestamp.toISOString(), equipmentId(v), v.equipmentType || v.name || '', readingUnitLabel(v),
        log.driverName || '', log.odometer, log.prevOdometer, log.recalled === true ? 'Yes' : 'No'
      ]);
    });
  });
  if (rows.length === 1) {
    status.textContent = dateFilter ? 'No readings found for ' + dateFilter + '.' : 'No readings to export.';
    return;
  }
  var suffix = dateFilter || 'all-history';
  downloadCsv(rows, 'fleet-reading-logs-' + suffix + '.csv');
  status.textContent = 'Exported ' + (rows.length - 1) + ' reading(s).';
}

function showQrModal(v) {
  var url = WEBAPP_URL + '?v=' + encodeURIComponent(v.id);
  var bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal">' +
    '<strong>' + esc(equipmentLabel(v)) + '</strong>' +
    '<div id="qr-canvas-holder"></div>' +
    '<p class="muted" style="word-break:break-all">' + esc(url) + '</p>' +
    '<button class="primary" id="qr-close">Close</button>' +
  '</div>';
  document.body.appendChild(bg);
  new QRCode(document.getElementById('qr-canvas-holder'), { text: url, width: 200, height: 200 });
  document.getElementById('qr-close').onclick = function () { document.body.removeChild(bg); };
  bg.onclick = function (e) { if (e.target === bg) document.body.removeChild(bg); };
}

function printAllEquipmentQrs(vehicles) {
  if (!vehicles.length) { alert('Walang equipment QR codes na maaaring i-print.'); return; }
  if (typeof QRCode === 'undefined') { alert('Hindi nag-load ang QR code library. I-refresh ang page at subukan ulit.'); return; }
  var printWindow = window.open('', '_blank');
  if (!printWindow) { alert('Pinipigilan ng browser ang print window. Payagan ang pop-ups para sa website at subukan ulit.'); return; }
  var sorted = vehicles.slice().sort(function (a, b) { return equipmentId(a).localeCompare(equipmentId(b)); });
  printWindow.document.open();
  printWindow.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Fleet equipment QR codes</title><style>' +
    'body{font-family:Arial,sans-serif;margin:12mm;color:#111}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8mm}.item{border:1px solid #aaa;border-radius:5px;padding:5mm;text-align:center;break-inside:avoid;min-height:48mm}.item h2{font-size:14pt;margin:0 0 2mm}.item p{font-size:9pt;margin:1mm 0 3mm;color:#444}.qr{display:flex;justify-content:center;min-height:130px}.qr img,.qr canvas{width:130px!important;height:130px!important}.url{font-size:7pt;word-break:break-all;margin-top:2mm}@page{size:auto;margin:10mm}@media print{body{margin:0}}</style></head><body><div class="grid">' +
    sorted.map(function (v, index) {
      var url = WEBAPP_URL + '?v=' + encodeURIComponent(v.id);
      return '<section class="item"><h2>' + esc(equipmentId(v)) + '</h2><p>' + esc(v.equipmentType || v.name || '') + '</p><div class="qr" id="print-qr-' + index + '"></div><div class="url">' + esc(url) + '</div></section>';
    }).join('') + '</div></body></html>');
  printWindow.document.close();
  sorted.forEach(function (v, index) {
    new QRCode(printWindow.document.getElementById('print-qr-' + index), {
      text: WEBAPP_URL + '?v=' + encodeURIComponent(v.id), width: 130, height: 130
    });
  });
  printWindow.focus();
  setTimeout(function () { printWindow.print(); }, 700);
}

    '<label for="edit-equipment-id">Equipment ID</label><input id="edit-equipment-id" value="' + esc(equipmentId(v)) + '">' +
    '<label for="edit-equipment-type">Equipment type</label><input id="edit-equipment-type" value="' + esc(v.equipmentType || v.name || '') + '">' +
    '<label for="edit-reading-unit">Reading unit</label><select id="edit-reading-unit"' + (v.readingCount ? ' disabled' : '') + '><option value="km"' + (readingUnit(v) === 'km' ? ' selected' : '') + '>Kilometers (odometer)</option><option value="hours"' + (readingUnit(v) === 'hours' ? ' selected' : '') + '>Hours (SMR)</option></select>' +
    (v.readingCount ? '<p class="muted">The reading unit is locked because this equipment has operator history; changing it would relabel past readings.</p>' : '') +
    '<label for="edit-service-plan">Service schedule</label><select id="edit-service-plan"><option value="pms_general"' + (v.servicePlan !== 'pms_only' ? ' selected' : '') + '>PMS + General Servicing</option><option value="pms_only"' + (v.servicePlan === 'pms_only' ? ' selected' : '') + '>PMS only</option></select>' +
    '<label id="edit-interval-label" for="edit-service-interval">General Servicing interval (' + readingUnitSuffix(v) + ')</label><input id="edit-service-interval" type="number" min="1" value="' + esc(hasGeneralService(v) ? generalServiceInterval(v) : pmsInterval(v)) + '">' +
    '<div id="edit-pms-derived-wrap"><label>PMS interval (calculated)</label><input id="edit-pms-interval-preview" type="number" value="' + esc(pmsInterval(v)) + '" readonly></div>' +
    '<div id="edit-pms-history-wrap" class="history-pair"><div><label for="edit-last-pms-date">Previous PMS date</label><input id="edit-last-pms-date" type="date" value="' + esc(dateInputValue(v.lastPMSDate)) + '"></div>' +
    '<div><label id="edit-last-pms-label" for="edit-last-pms">Previous PMS reading</label><input id="edit-last-pms" type="number" min="0" value="' + esc(v.lastPMSOdometer) + '"></div></div>' +
    '<div id="edit-general-history-wrap" class="history-pair"><div><label for="edit-last-general-date">Previous General Servicing date (optional; defaults to PMS date)</label><input id="edit-last-general-date" type="date" value="' + esc(dateInputValue(v.lastGeneralServiceDate)) + '"></div>' +
    '<div><label id="edit-last-general-label" for="edit-last-general">Previous General Servicing reading (optional; defaults to PMS reading)</label><input id="edit-last-general" type="number" min="0" value="' + esc(v.lastGeneralServiceOdometer == null ? '' : v.lastGeneralServiceOdometer) + '"></div></div>' +
    '<label id="edit-current-reading-label" for="edit-current-odo">Current reading</label><input id="edit-current-odo" type="number" min="0" value="' + esc(v.currentOdometer) + '">' +
    '<div id="edit-next-pms-wrap"><label for="edit-next-pms-date">Next PMS date (optional; blank uses automatic forecast)</label><input id="edit-next-pms-date" type="date" value="' + esc(dateValue(scheduleDate(v, 'pms'))) + '"></div>' +
    '<div id="edit-next-general-wrap"><label for="edit-next-general-date">Next General Servicing date (optional; blank uses automatic forecast)</label><input id="edit-next-general-date" type="date" value="' + esc(dateValue(scheduleDate(v, 'general'))) + '"></div>' +
    '<div id="edit-equipment-error" class="err"></div>' +
    '<div class="actions"><button id="edit-cancel">Cancel</button><button class="primary" id="edit-save" style="flex:1">Save changes</button></div>' +
    '</div>';
  document.body.appendChild(bg);
  document.getElementById('edit-cancel').onclick = function () { document.body.removeChild(bg); };
  bg.onclick = function (event) { if (event.target === bg) document.body.removeChild(bg); };
  var updateEditPlan = function () {
    var servicePlan = document.getElementById('edit-service-plan').value;
    var unit = document.getElementById('edit-reading-unit').value === 'hours' ? 'hours' : 'km';
    var readingName = unit === 'hours' ? 'SMR' : 'odometer';
    var pmsOnly = servicePlan === 'pms_only';
    document.getElementById('edit-interval-label').textContent = pmsOnly
      ? 'PMS interval (' + unit + ')'
      : 'General Servicing interval (' + unit + ')';
    document.getElementById('edit-last-pms-label').textContent = 'Previous PMS ' + readingName + ' reading (' + unit + ')';
    document.getElementById('edit-current-reading-label').textContent = 'Current ' + readingName + ' reading';
    document.getElementById('edit-pms-interval-preview').previousElementSibling.textContent =
      'PMS interval (calculated, ' + unit + ')';
    document.getElementById('edit-service-interval').placeholder = pmsOnly ? 'e.g. 500' : 'e.g. 2500';
    document.getElementById('edit-pms-derived-wrap').style.display = servicePlan === 'pms_general' ? '' : 'none';
    document.getElementById('edit-pms-history-wrap').style.display = '';
    document.getElementById('edit-general-history-wrap').style.display = pmsOnly ? 'none' : '';
    document.getElementById('edit-last-general-label').textContent =
      'Previous General Servicing ' + readingName + ' reading (optional; defaults to PMS reading)';
    document.getElementById('edit-next-pms-wrap').style.display = '';
    document.getElementById('edit-next-general-wrap').style.display = pmsOnly ? 'none' : '';
  };
  document.getElementById('edit-service-plan').onchange = updateEditPlan;
  document.getElementById('edit-reading-unit').onchange = updateEditPlan;
  updateEditPlan();
  document.getElementById('edit-service-interval').oninput = function () {
    document.getElementById('edit-pms-interval-preview').value = (Number(this.value) || 0) * 2;
  };
  document.getElementById('edit-save').onclick = function () {
    var save = this, error = document.getElementById('edit-equipment-error');
    var values = {
      equipmentId: document.getElementById('edit-equipment-id').value,
      equipmentType: document.getElementById('edit-equipment-type').value,
      servicePlan: document.getElementById('edit-service-plan').value,
      readingUnit: document.getElementById('edit-reading-unit').value,
      serviceInterval: document.getElementById('edit-service-interval').value,
      lastPMSOdometer: document.getElementById('edit-last-pms').value,
      lastPMSDate: document.getElementById('edit-last-pms-date').value,
      lastGeneralServiceOdometer: document.getElementById('edit-last-general').value,
      lastGeneralServiceDate: document.getElementById('edit-last-general-date').value,
      currentOdometer: document.getElementById('edit-current-odo').value,
      nextPMSDate: document.getElementById('edit-next-pms-date').value,
      nextGeneralServiceDate: document.getElementById('edit-next-general-date').value
    };
    save.disabled = true; save.textContent = 'Saving…'; error.textContent = '';
    updateVehicleDetails(v.id, values).then(function () {
      document.body.removeChild(bg);
      loadAdmin();
    }).catch(function (err) {
      error.textContent = 'Could not save: ' + (err.message || err);
      save.disabled = false; save.textContent = 'Save changes';
    });
  };
}

function renderCalendar(vehicles) {
  var now = new Date(), year = calendarCursor.getFullYear(), month = calendarCursor.getMonth();
  var first = new Date(year, month, 1), days = new Date(year, month + 1, 0).getDate();
  var html = '<div class="card calendar"><div class="row"><div><button id="calendar-prev" class="ghost" type="button">&larr;</button> <strong>Service schedule — ' + calendarCursor.toLocaleString(undefined, { month: 'long', year: 'numeric' }) + '</strong> <button id="calendar-next" class="ghost" type="button">&rarr;</button></div><span class="muted">Scheduled PMS and General Servicing dates</span></div><div class="calendar-head">';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(function (d) { html += '<div>' + d + '</div>'; });
  html += '</div><div class="calendar-grid">';
  for (var i = 0; i < first.getDay(); i++) html += '<div class="calendar-day empty"></div>';
  for (var day = 1; day <= days; day++) {
    var key = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
    var today = key === dateValue(now);
    html += '<div class="calendar-day' + (today ? ' today' : '') + '"><strong>' + day + '</strong>';
    vehicles.forEach(function (v) {
      ['pms', 'general'].forEach(function (service) {
        if (dateKey(scheduleDate(v, service)) === key) {
          html += '<span class="event">' + esc(equipmentId(v)) + ' — ' + (service === 'general' ? 'General Servicing' : 'PMS') + '</span>';
        }
      });
    });
    html += '</div>';
  }
  return html + '</div></div>';
}

function renderEquipmentTypeList(vehicles) {
    var groups = {};
    vehicles.forEach(function (v) {
      var type = (v.equipmentType || v.name || 'Unspecified type').trim();
      if (!groups[type]) groups[type] = [];
      groups[type].push(v);
    });
    var types = Object.keys(groups).sort(function (a, b) { return a.localeCompare(b); });
    var html = '<div class="card type-list"><div class="row"><strong>Equipment list by type</strong><span class="muted">' + vehicles.length + ' total</span></div>';
    if (!types.length) return html + '<p class="muted">No registered equipment yet.</p></div>';
    types.forEach(function (type) {
      html += '<div class="type-group"><div class="type-group-title">' + esc(type) + ' <span class="muted">(' + groups[type].length + ')</span></div>';
      groups[type].sort(function (a, b) { return equipmentId(a).localeCompare(equipmentId(b)); }).forEach(function (v) {
        var hasPms = hasPMS(v);
        var hasGeneral = hasGeneralService(v);
        var p = hasPms ? computeServiceStatus(v, 'pms') : null;
        var gs = hasGeneral ? computeServiceStatus(v, 'general') : null;
        var nextPMS = scheduleDate(v, 'pms');
        var nextGeneral = scheduleDate(v, 'general');
        html += '<div class="equipment-row">' +
          '<div><strong>' + esc(equipmentId(v)) + '</strong><small>' + esc(readingUnitName(v)) + ': ' + Number(v.currentOdometer).toLocaleString() + ' ' + readingUnitSuffix(v) + '</small></div>' +
          (hasPms ? '<div><span class="badge ' + p.status + '">PMS ' + statusLabel(p.status) + '</span><small>' + p.readingSinceLastService.toLocaleString() + ' ' + readingUnitSuffix(v) + ' since PMS · interval ' + pmsInterval(v).toLocaleString() + ' ' + readingUnitSuffix(v) + '</small></div>' : '') +
          (hasGeneral ? '<div><span class="badge ' + gs.status + '">GS ' + statusLabel(gs.status) + '</span><small>' + gs.readingSinceLastService.toLocaleString() + ' ' + readingUnitSuffix(v) + ' since General Service · interval ' + generalServiceInterval(v).toLocaleString() + ' ' + readingUnitSuffix(v) + '</small></div>' : '') +
          '<div><strong>' + (hasPms ? 'PMS: ' + (nextPMS ? esc(dateValue(nextPMS)) : 'Not forecast yet') : 'GS: ' + (nextGeneral ? esc(dateValue(nextGeneral)) : 'Not forecast yet')) + '</strong>' +
          (hasPms && hasGeneral ? '<small>GS: ' + (nextGeneral ? esc(dateValue(nextGeneral)) : 'Not forecast yet') + '</small>' : '') + '</div>' +
          '<button id="list-qr-' + v.id + '" type="button">QR</button>' +
          '</div>';
      });
      html += '</div>';
    });
    return html + '</div>';
}
</script>
